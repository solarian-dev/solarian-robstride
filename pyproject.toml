[project]
name = "solarian-robstride"
version = "0.1.0"
description = "Robstride servo actuator and CAN bus plugin for the Solarian robotics framework"
authors = [
    {name = "Raul Garreta", email = "raul@solarian.dev"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.10"
dependencies = [
    "solarian>=0.1.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Empty: the CH340 USB-CAN adapter is driven over pyserial, which the bus
# imports at load time. Declared so module plugins can ask for
# solarian-robstride[hardware] like every other actuator plugin.
hardware = []

[project.entry-points."solarian.actuators"]
robstride = "solarian_robstride.actuator:RobstrideServo"

[project.entry-points."solarian.actuator_buses"]
robstride = "solarian_robstride.bus:RobstrideBus"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solarian_robstride*"]
